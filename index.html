<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Conect – Kenya's Community Social Platform</title>
    <meta name="description" content="Conect is Kenya's community-driven social platform. Join locality-based groups, discover local stories, trade on the marketplace, and connect with verified Kenyans near you." />
    <meta name="keywords" content="Kenya social media, Kenyan community, locality groups, marketplace Kenya, Conect app, Kenyan platform, verified users" />
    <meta name="author" content="Conect" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ward-circle-social.lovable.app/" />
    <meta name="theme-color" content="#006600" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ward-circle-social.lovable.app/" />
    <meta property="og:title" content="Conect – Kenya's Community Social Platform" />
    <meta property="og:description" content="Join locality-based groups, discover local stories, trade on the marketplace, and connect with verified Kenyans near you." />
    <meta property="og:image" content="https://ward-circle-social.lovable.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:site_name" content="Conect" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Conect – Kenya's Community Social Platform" />
    <meta name="twitter:description" content="Join locality-based groups, discover local stories, trade on the marketplace, and connect with verified Kenyans near you." />
    <meta name="twitter:image" content="https://ward-circle-social.lovable.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Conect",
      "url": "https://ward-circle-social.lovable.app",
      "description": "Kenya's community-driven social platform. Join locality-based groups, discover local stories, trade on the marketplace, and connect with verified Kenyans.",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KES"
      },
      "author": {
        "@type": "Organization",
        "name": "Conect"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ward-circle-social.lovable.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
